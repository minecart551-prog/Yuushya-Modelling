pluginManagement {
    repositories {
        mavenLocal()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        // Architectury Loom depends on Forge tooling (installertools, mcinjector,
        // DiffPatch) for remapping even in a Fabric-only build. Do not remove.
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

// 1.20.1 Fabric-only build.
include("1.20.1")
include("1.20.1:common")
include("1.20.1:fabric")
include("1.20.1:fabric-like")

// Root-level "common" project: holds the shared assets & data (no Java sources).
// gen-1.20.1 copies its processed resources into 1.20.1/common.
include("common")

rootProject.name = "Yuushya-Modelling"
