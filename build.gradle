allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

// 1.20.1 Fabric-only convenience tasks.

// Run the client from source:  gradle runClient
tasks.register("runClient"){
    dependsOn(":1.20.1:fabric:runClient")
}

// Copy the built Fabric jar into ./build/libs as yuushya-modelling-1.20.1-fabric-<version>.jar
tasks.register("build-jar",Copy){
    dependsOn(":1.20.1:fabric:build")
    with{
        from("./1.20.1/fabric/build/libs/yuushya-modelling-${mod_version}.jar")
        rename {"yuushya-modelling-1.20.1-fabric-${mod_version}.jar"}
        into("./build/libs")
        duplicatesStrategy(DuplicatesStrategy.INHERIT)
    }
}

// Generate assets/data into 1.20.1/common, then build the Fabric jar.
// Equivalent to the old test-chain, minus every other version.
tasks.register("build-1.20.1-fabric"){
    dependsOn(":common:gen-1.20.1")
    dependsOn(":1.20.1:fabric:build")
}
