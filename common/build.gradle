// Root-level "common" project: holds the shared assets & data (no Java sources).
// Its processed resources are copied into 1.20.1/common at build time.

tasks.register('generateAssetsAndData'){
    dependsOn(processResources)
    finalizedBy('copyLicense')
}

tasks.register('copyLicense',Copy){
    from "../LICENSE"
    into "./build/resources/main/"
}

tasks.register("clean-resource-1.20.1"){
    dependsOn(":1.20.1:common:clean")
}

// Copy the shared assets & data (including recipes/advancements/loot_tables)
// into 1.20.1/common's resources so the mod jar picks them up.
tasks.register("copyAssetsAndDataFromCommon-1.20.1",Copy){
    dependsOn("generateAssetsAndData")
    dependsOn("clean-resource-1.20.1")
    mustRunAfter('copyLicense')
    from("./build/resources/main/")
    into("../1.20.1/common/build/resources/main/")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("gen-1.20.1"){
    dependsOn("copyAssetsAndDataFromCommon-1.20.1")
}
